<html lang="ja">
<head>

  <title>昆虫とおしりの部屋 — アドベンチャー版</title>

<body>
<main id="app">
  <section id="titleScreen" aria-label="タイトル">
    <div class="title-art"></div><div class="title-grain"></div>
    <div class="title-content">
      <p class="eyebrow">怪奇群像アドベンチャー</p>
      <h1>昆虫と<br><span>おしりの部屋</span></h1>
      <p class="title-catch">あの夜、僕だけが無事だった。</p>
      <div class="title-rule"></div>
      <nav class="title-buttons">
        <button id="newGame"><b>はじめから</b><small>あの夏の朝へ</small><i>→</i></button>
        <button id="continueGame" hidden><b>つづきから</b><small id="saveLabel"></small><i>→</i></button>
        <button id="titleFlow" hidden><b>物語の分岐</b><small>たどった場面を振り返る</small><i>↗</i></button>
      </nav>
      <p class="title-note">調べる。話す。証言をつなぐ。<br>クリック / タップで進行 · Enter でも会話を進められます</p>
    </div>
    <span class="edition">NOVEL ADVENTURE · 02</span>
  </section>

  <section id="game" hidden aria-label="ゲーム画面">
    <div id="stage">
      <img id="background" alt="" draggable="false">
      <div class="scene-tone"></div><div id="soundVeil"></div>
      <img id="character" alt="" draggable="false" hidden>
      <div id="hotspots" aria-label="画面を調べる"></div>
      <div id="sceneCaption"></div>
      <div id="imageError" hidden role="alert">画像を読み込めませんでした。<button id="retryImage">再読み込み</button></div>
      <div id="chapterStamp"><span id="chapterNo"></span><strong id="chapterTitle"></strong></div>
    </div>
    <header class="game-top">
      <div class="scene-heading"><span id="timeLabel"></span><h2 id="locationLabel"></h2></div>
      <button id="povButton" title="視点と進行状況"><span class="pov-dot"></span><span id="povLabel"></span><small>視点</small></button>
      <nav aria-label="メニュー">
        <button id="journalButton">証拠手帳 <span id="evidenceCount">0</span></button>
        <button id="flowButton">人物・分岐</button>
        <button id="historyButton" aria-label="会話履歴">履歴</button>
        <button id="settingsButton" aria-label="設定">設定</button>
      </nav>
    </header>
    <div id="inventory" aria-label="所持品"></div>
    <aside id="investigation" hidden>
      <div class="section-label">INVESTIGATION <span>調査</span></div>
      <p id="objective"></p>
      <div id="inspectList"></div>
      <div id="actionList"></div>
    </aside>
    <section id="dialogue" hidden aria-live="polite">
      <div id="speakerRow"><span id="speaker"></span><span id="memoryTag"></span></div>
      <button id="dialogueAdvance" aria-label="会話を進める"><span id="dialogueText"></span><span id="nextMark">続きを見る　▸</span></button>
      <div class="dialogue-tools"><button id="autoButton">自動 OFF</button><span>クリック / Enter</span><button id="logInline">履歴</button></div>
    </section>
    <section id="choices" hidden aria-label="選択肢"><div id="choicePrompt"></div><div id="choiceList"></div></section>
    <section id="endCard" hidden aria-label="結末"><small>この物語の結末</small><h2 id="endName"></h2><p id="endText"></p><button id="rewindEnding">分かれ道に戻る</button><button id="endingFlow">物語の分岐</button><button id="endingTitle">タイトルへ</button></section>
    <div id="toast" role="status"></div>
    <footer class="game-footer"><span id="modeLabel">探索</span><span id="savedLabel">自動保存</span><button id="muteButton" aria-label="音を切り替える">♪ 音あり</button></footer>

 revelation:{chapter:5,title:'三つとも、だいじ',location:'開いた宝箱',time:'現在 · 帰郷の翌日',pov:'adult',bg:'chest',music:'dread',intro:[L('','鍵が回った。蓋の下には、三つあった。'),L('','布を少しだけ開く。母のもの。父のもの。弟のもの。年月が経っているのに、朽ちていない。'),L('','それぞれに、一枚ずつ。ちゃんこが貼った、だいじなものシール。'),L('adult','……三枚。'),L('','四枚のうち一枚は、森の虫に。残りの三枚は、家族に。'),L('','箱をしまった腕の重さが、ようやく自分のものになる。'),L('adult','家に帰って、みんないて……ずっと、いなくならないでほしいって……。'),L('','墓で揺らいだ意識に、祖先の人格が入り込んだ。家族への思いは、家族を切り取って残すという行為に変えられた。'),L('adult','誰も、窓からなんか来ていない。僕だった。'),L('','失われた時間を埋めたのは、自分だけが助かったという物語。顔のない男の「同じ目」は、目をそらした自分の輪郭だった。'),L('adult','シャルロットも……ごめん。')],give:['chestTruth'],actions:[A('真実を知ったあと、どうするか',null,{prompt:'箱を閉じても、事実は消えない。この先を、誰と引き受ける。',choices:[A('家族と、調べてくれた人たちに話す','family-ending-scene'),A('自分だけで責任を背負い、誰とも会わない','alone-ending')]})]},
 'family-ending-scene':{chapter:6,title:'家族の前で',location:'旧宅のリビング',time:'現在 · 帰郷翌日の夕方',pov:'adult',bg:'living-night',music:'sad',intro:[L('adult','あの夜、みんなを傷つけたのは、僕だった。祖先のせいだけにして、僕のしたことを消したくない。'),L('mama','私も、あなたに話さなかった。自分がしたことを、隠した。'),L('papa','すぐに何もかも許す、とは言えない。怖い。でも、聞いたからって、お前が家族じゃなくなるわけじゃない。'),L('adultBrother','今度は、僕にも本当のことを話して。小さいからって、外に置かないで。'),L('police','記録に残す。私自身の過去も含めてだ。これ以上、誰か一人の中に閉じ込めない。'),L('adultKuri','俺も、訂正する。お前に会えなくなるのが怖くて、言えなかった。でも、もう嘘でつながるのは嫌だ。'),L('pepe','戻す方法も、血を止める方法も、見つかったとは言えない。知らないことを、知っているふりは、もうしない。'),L('sumika','分かった事実と、まだ分からないこと。その両方を、残しましょう。'),L('','失ったものが元に戻ったわけではない。けれど、箱の中にしまわれたままの家族では、なくなった。')],actions:[A('最後の場面へ','grave-final')]},
 'grave-final':{chapter:6,title:'まだ、そこにある',location:'森の奥の墓',time:'その夜',pov:'none',bg:'grave-night',music:'silence',intro:[L('','村から離れた森に、夜が降りていた。'),L('','人のいない獣道。濡れた岩。読めない名。'),L('','墓は、何も変わっていない。'),L('','――静けさの底から、あの音が、また長く響いた。',{sfx:'ring'})],end:'family'},
 'father-silence':{chapter:3,title:'父の沈黙',location:'大学の町の交番',time:'現在',pov:'police',bg:'city-police',music:'sad',intro:[L('police','これは、記録に入れないでくれ。家族のためだ。'),L('makabe','その家族に、選ばせてもいないじゃないですか。'),L('','引き出しが閉じた。ちゃんこは、今日も外にいる犯人を捜す。父親を名乗れない男が、そのすぐ近くで見守っている。')],end:'father'},
 'record-ending':{chapter:4,title:'残された記録',location:'村の資料室',time:'現在 · 数日後',pov:'sumika',bg:'archive',music:'sad',intro:[L('sumika','彼が席を立っても、記録は残ります。'),L('','警官の過去、くりたけの訂正、家族の証言。紙の上ではつながり始めていた。'),L('','しかし、ちゃんこの部屋の箱は閉じたままだ。資料には「未確認」と書き添えられた。'),L('sumika','本人が受け取れる形を、まだ見つけられていない。')],end:'record'},
 'closed-ending':{chapter:5,title:'閉じた部屋',location:'開かなかった勉強部屋',time:'現在',pov:'adult',bg:'dream',music:'dread',intro:[L('adult','まだ、開けなくていい。犯人を見つけてからだ。'),L('','鍵は、使われなかった。ちゃんこは村を出て、顔を思い出せない男を捜し続ける。'),L('charlotte','このドアは、決して開けてはいけないよ。'),L('','次の夜も、夢は同じところで終わった。')],end:'closed'},
 'alone-ending':{chapter:6,title:'ひとりの告白',location:'勉強部屋',time:'現在 · 夜',pov:'adult',bg:'study',tone:'night',music:'sad',intro:[L('adult','全部、僕が悪い。僕がいなくなれば……。'),L('','ちゃんこは事実を手紙に書いた。けれど、誰にも会わず、どうすれば次を防げるかを話し合わなかった。'),L('','罪を認めることと、一人で閉じこもること。その違いを、まだ見つけられない。'),L('','扉の外で、家族が呼んでいる。')],end:'alone'}
};
const endings={father:{name:'父の沈黙',text:'守るために伏せた過去が、\n次の調査を止めてしまった。',rewind:'police'},record:{name:'残された記録',text:'証言は残った。\nだが、箱を確かめる人は席を立った。',rewind:'meeting'},closed:{name:'閉じた部屋',text:'扉の向こうに、だいじなものを残したまま。\n誰かを捜す日々が続く。',rewind:'old-room'},alone:{name:'ひとりの告白',text:'犯人は分かった。\nその先を引き受ける言葉は、まだ届かない。',rewind:'revelation'},family:{name:'家族の前で',text:'だいじなものを、もう閉じ込めない。\nけれど、あの墓は、まだ森にある。',rewind:'revelation'}};
const chapters=['序章 ─ 虫の部屋','第一章 ─ 森の声','第二章 ─ 助かった子','第三章 ─ 四つの証言','第四章 ─ 食い違う夜','第五章 ─ だいじなもの','終章 ─ 開いたあと'];

<script>/* Standalone browser ADV. No CDN, backend, or loading gate. */
(()=>{'use strict';
const D=window.ADV,$=id=>document.getElementById(id),clone=v=>JSON.parse(JSON.stringify(v));
const SAVE='konchu_adv_save_1',PROFILE='konchu_adv_profile_1',SETTINGS='konchu_adv_settings_1';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const read=(k,f)=>{try{return JSON.parse(localStorage.getItem(k))||f}catch{return f}};
const write=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch{return false}};
let profile=read(PROFILE,{endings:[],checkpoints:{},read:[]});
if(!profile.checkpoints||!Array.isArray(profile.endings))profile={endings:[],checkpoints:{},read:[]};
let settings={volume:.35,muted:false,speed:25,...read(SETTINGS,{})};
let s=null,typing=null,autoTimer=null,auto=false,fullText='',rendered=false,toastTimer=null,lastArt='',audio=null,ended=false;
const art=name=>window.ADV_ASSETS?.[name]||`assets/${name}.webp`;
const fresh=()=>({version:1,node:D.start,flags:[],evidence:[],known:{},items:[],visited:[],inspected:{},cast:[],history:[],mode:'idle',cursor:0,activeHotspot:null,activeAction:null,ending:null,source:null});
const node=()=>D.nodes[s.node];
const has=k=>s.flags.includes(k)||s.evidence.includes(k);
const matches=req=>!req||(Array.isArray(req)?req.every(has):has(req));
const uniq=(arr,v)=>{if(!arr.includes(v))arr.push(v)};
function toast(text){$('toast').textContent=text;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),3300)}
function save(){if(!s)return;const ok=write(SAVE,s);write(PROFILE,profile);$('savedLabel').textContent=ok?'自動保存済み':'この環境では保存不可 · 設定から書き出せます'}
function settingsSave(){write(SETTINGS,settings);audio?.volume();$('muteButton').textContent=settings.muted?'♪ 消音':'♪ 音あり'}
function evidence(id,owner=node().pov,share=false){if(!D.evidence[id])return;const isNew=!s.evidence.includes(id);uniq(s.evidence,id);if(owner&&!['none','group'].includes(owner)){s.known[owner]??=[];uniq(s.known[owner],id)}if(share){for(const who of ['adult','police','adultKuri','sumika']){s.known[who]??=[];uniq(s.known[who],id)}}if(isNew)toast(`証拠手帳に記録\n${D.evidence[id].title}`)}
function effects(obj){for(const [to,from]of Object.entries(obj.inherit||{})){s.known[to]??=[];for(const id of s.known[from]||[])uniq(s.known[to],id)}for(const f of obj.set||[])uniq(s.flags,f);for(const id of obj.give||[])evidence(id);for(const id of obj.share||[])evidence(id,node().pov,true);for(const id of obj.items||[])uniq(s.items,id)}
function checkpoint(id){if(profile.checkpoints[id])return;const snap=clone(s);delete snap.history;snap.node=id;snap.mode='intro';snap.cursor=0;snap.activeHotspot=null;snap.activeAction=null;snap.ending=null;snap.source=null;profile.checkpoints[id]=snap}
function enter(id,{revisit=false}={}){if(!D.nodes[id])throw Error('Unknown scene: '+id);stopText();s.node=id;s.ending=null;s.activeHotspot=null;s.activeAction=null;s.cursor=0;s.mode='intro';s.source=null;checkpoint(id);const seen=s.visited.includes(id);uniq(s.visited,id);effects(node());drawScene();if(seen&&!revisit){s.mode='idle';renderIdle()}else showLine();save()}
function restore(id){const cp=profile.checkpoints[id];if(!cp)return;const prior=s?.history||[];s={...fresh(),...clone(cp),history:prior};closePanel();$('titleScreen').hidden=true;$('game').hidden=false;ensureAudio();enter(id,{revisit:true});toast('この場面に到達した時点の証拠・選択に戻りました')}
function stopText(){clearInterval(typing);typing=null;clearTimeout(autoTimer);autoTimer=null}
function addHistory(who,text){s.history.push({who,text,scene:node().title});if(s.history.length>500)s.history.shift()}
function queue(){if(s.mode==='intro')return node().intro||[];if(s.mode==='hotspot')return node().hotspots.find(h=>h.id===s.activeHotspot)?.lines||[];if(s.mode==='action')return node().actions[s.activeAction]?.lines||[];return[]}
function setCharacter(who,mood){const c=D.characters[who];if(!c){$('character').hidden=true;return}uniq(s.cast,who);const img=$('character');img.hidden=false;img.dataset.child=!!c.child;img.dataset.beetle=!!c.beetle;img.dataset.mood=mood||'';img.alt=c.name;let variant=c.art;if(who==='chanko'&&node().chapter>=1&&node().music!=='day')variant='chanko-child-fear';if(who==='adult'&&['revelation','family-ending-scene','alone-ending'].includes(s.node))variant='chanko-adult-grief';if(who==='mama'&&node().chapter>=2)variant='mama-grief';if(who==='adultKuri'&&['kuri-confess','kuri-delay','meeting','meeting-kuri','meeting-records','family-ending-scene'].includes(s.node))variant='kuri-adult-guilt';const src=art(variant);if(img.getAttribute('src')!==src)img.src=src}
function showLine({resume=false}={}){stopText();const lines=queue();if(s.cursor>=lines.length){finishConversation();return}const line=lines[s.cursor];$('investigation').hidden=true;$('hotspots').hidden=true;$('choices').hidden=true;$('endCard').hidden=true;$('dialogue').hidden=false;$('sceneCaption').textContent='';$('modeLabel').textContent=node().memory?'記憶をたどる':'会話';setCharacter(line.who,line.mood);const cg=lines.slice(0,s.cursor+1).findLast(l=>l.bg);$('game').classList.toggle('cg',!!cg);if(cg){const src=art('bg-'+cg.bg);if(lastArt!==src){lastArt=src;$('background').src=lastArt;}$('character').hidden=true;}else if(lastArt!==art('bg-'+node().bg)){lastArt=art('bg-'+node().bg);$('background').src=lastArt;}$('speaker').textContent=D.characters[line.who]?.name||'記録';$('memoryTag').textContent=node().memory?'ちゃんこの記憶':line.who?'':'情景';fullText=line.text;rendered=false;$('dialogueText').textContent='';$('nextMark').hidden=true;if(!resume){addHistory(D.characters[line.who]?.name||'情景',line.text);if(line.sfx==='ring')ring();effects(line)}
if(settings.speed===0||window.matchMedia('(prefers-reduced-motion: reduce)').matches){reveal()}else{let shown=0;typing=setInterval(()=>{shown+=Math.max(1,Math.ceil(settings.speed/15));$('dialogueText').textContent=fullText.slice(0,shown);if(shown>=fullText.length)reveal()},32)}save()}
function reveal(){clearInterval(typing);typing=null;$('dialogueText').textContent=fullText;rendered=true;$('nextMark').hidden=false;if(auto){clearTimeout(autoTimer);autoTimer=setTimeout(()=>advance(),Math.max(1500,fullText.length*70))}}
function advance(){if(!s||!['intro','hotspot','action'].includes(s.mode)||$('panel').open||$('beetleGame').open)return;if(!rendered){reveal();return}stopText();s.cursor++;showLine()}
function finishConversation(){if(s.mode==='hotspot'){const h=node().hotspots.find(h=>h.id===s.activeHotspot);effects(h);s.inspected[s.node]??=[];uniq(s.inspected[s.node],h.id)}else if(s.mode==='action'){const a=node().actions[s.activeAction];effects(a);if(a.to){enter(a.to);return}}s.activeHotspot=null;s.activeAction=null;s.mode='idle';if(node().end){finishEnding(node().end);return}renderIdle();save()}
function drawScene(){const n=node();$('game').className=n.tone?'tone-'+n.tone:'';$('timeLabel').textContent=n.time;$('locationLabel').textContent=n.location;$('povLabel').textContent=D.characters[n.pov]?.name||(n.pov==='group'?'四人の視点':'情景');$('chapterNo').textContent=`CHAPTER ${String(n.chapter).padStart(2,'0')}`;$('chapterTitle').textContent=D.chapters[n.chapter];$('endCard').hidden=true;$('imageError').hidden=true;const src=art('bg-'+n.bg);if(lastArt!==src){lastArt=src;$('background').src=src}$('background').alt=n.location;audio?.theme(n.music||'investigation');renderInventory();$('evidenceCount').textContent=s.evidence.length;settingsSave()}
function button(label,fn,cls){const b=document.createElement('button');b.textContent=label;if(cls)b.className=cls;b.onclick=fn;return b}
function renderInventory(){const el=$('inventory');el.replaceChildren();for(const id of s.items){const item=D.items[id];if(!item)continue;const b=button(`${item.icon} ${item.name}`,()=>itemPanel(id));if(id==='stickers'&&node().chapter<2){const count=document.createElement('em');count.textContent=has('oneSticker')?'3':'4';b.append(count)}el.append(b)}}
function renderIdle(){stopText();drawScene();$('dialogue').hidden=true;$('choices').hidden=true;$('investigation').hidden=false;$('hotspots').hidden=false;$('character').hidden=true;$('objective').textContent=node().objective||'次へ進む前に、証拠手帳や会話履歴を確認できます。';$('modeLabel').textContent=node().pov==='group'?'視点を選ぶ':'探索';$('inspectList').replaceChildren();$('actionList').replaceChildren();$('hotspots').replaceChildren();$('sceneCaption').textContent='';for(const h of node().hotspots||[]){if(h.requires&&!matches(h.requires))continue;const done=s.inspected[s.node]?.includes(h.id);const b=button('',()=>inspect(h.id),done?'done':'');b.innerHTML=`<span>${done?'✓':'◇'}</span>${esc(h.label)}`;$('inspectList').append(b);const spot=button('',()=>inspect(h.id),done?'done':'');spot.innerHTML=`${done?'✓':'+'}<span>${esc(h.label)}</span>`;spot.style.left=h.x+'%';spot.style.top=h.y+'%';spot.setAttribute('aria-label',h.label);$('hotspots').append(spot)}(node().actions||[]).forEach((a,i)=>{if(a.showUnless&&matches(a.showUnless))return;if(a.showIf&&!matches(a.showIf))return;const allowed=matches(a.requires);const b=button('',()=>act(i));b.innerHTML=`${esc(a.label)}${allowed?'　→':`<small>${esc(a.locked||'必要な手がかりを調べる')}</small>`}`;b.disabled=!allowed;$('actionList').append(b)});if(!(node().hotspots||[]).length&&!node().objective){$('objective').textContent=''}save()}
function inspect(id){if(s.mode!=='idle')return;const h=node().hotspots?.find(h=>h.id===id);if(!h||!matches(h.requires))return;s.mode='hotspot';s.activeHotspot=id;s.cursor=0;showLine()}
function act(index){if(s.mode!=='idle')return;const a=node().actions?.[index];if(!a||!matches(a.requires))return;s.activeAction=index;if(a.special==='catch'){openCatch();return}if(a.challenge){openChallenge(a.challenge);return}if(a.choices){s.mode='choice';renderChoices();save();return}if(a.lines){s.mode='action';s.cursor=0;showLine();return}effects(a);if(a.to)enter(a.to);else renderIdle()}
function renderChoices(){$('dialogue').hidden=true;$('investigation').hidden=true;$('hotspots').hidden=true;$('choices').hidden=false;$('choicePrompt').textContent=node().actions[s.activeAction].prompt;$('choiceList').replaceChildren();node().actions[s.activeAction].choices.forEach((c,i)=>{$('choiceList').append(button(c.label,()=>choose(i)))});$('modeLabel').textContent='選択'}
function choose(i){if(s.mode!=='choice')return;const c=node().actions[s.activeAction]?.choices?.[i];if(!c)return;addHistory('選択',c.label);effects(c);enter(c.to)}
function openChallenge(ch){openPanel('EVIDENCE','証拠を示す');$('panelBody').innerHTML=`<p class="panel-note">${esc(ch.prompt)}</p><div class="evidence-options"></div><p id="challengeFeedback" class="panel-note" role="status"></p>`;const list=$('panelBody').querySelector('.evidence-options');for(const id of ch.options){if(!has(id))continue;list.append(button(D.evidence[id].title,()=>{if(id===ch.answer){closePanel();enter(ch.success)}else $('challengeFeedback').textContent=ch.wrong}))}}
function finishEnding(id){const e=D.endings[id];s.mode='ending';s.ending=id;uniq(profile.endings,id);stopText();$('dialogue').hidden=true;$('investigation').hidden=true;$('hotspots').hidden=true;$('character').hidden=true;$('choices').hidden=true;$('endCard').hidden=false;$('endName').textContent=e.name;$('endText').textContent=e.text;$('modeLabel').textContent='結末';$('rewindEnding').onclick=()=>restore(e.rewind);save()}
function openPanel(kicker,title){clearTimeout(autoTimer);$('panelKicker').textContent=kicker;$('panelTitle').textContent=title;$('panelBody').replaceChildren();if(!$('panel').open)$('panel').showModal()}
function closePanel(){$('panel').close();if(auto&&rendered&&s&&['intro','hotspot','action'].includes(s.mode))autoTimer=setTimeout(advance,1500)}
function journal(){openPanel('CASE FILE','証拠手帳');const body=$('panelBody');body.innerHTML='<p class="panel-note">調べて分かったことだけを記録しています。「知っている人」は作中でその事実を知った人物です。</p>';if(!s.evidence.length){body.innerHTML+='<p class="panel-note">まだ証拠はありません。場面を調べると記録されます。</p>';return}for(const id of s.evidence){const e=D.evidence[id];const owners=Object.entries(s.known).filter(([,a])=>a.includes(id)).map(([p])=>D.characters[p]?.name||p);const div=document.createElement('article');div.className='entry';div.innerHTML=`<h3>${esc(e.title)}</h3><p>${esc(e.text)}</p><small>出典：${esc(e.source)}</small><div>${owners.map(x=>`<span class="evidence-tag">${esc(x)}</span>`).join('')}</div>`;body.append(div)}}
function flow(tab='flow'){openPanel('STORY CHART',tab==='cast'?'登場人物':'人物・分岐');const body=$('panelBody'),tabs=document.createElement('div');tabs.className='panel-tabs';tabs.append(button('物語の分岐',()=>flow('flow'),tab==='flow'?'active':''),button('登場人物',()=>flow('cast'),tab==='cast'?'active':''),button('結末の記録',()=>flow('ends'),tab==='ends'?'active':''));body.append(tabs);if(tab==='cast'){const grid=document.createElement('div');grid.className='cast-grid';for(const id of s?.cast||[]){const c=D.characters[id];const div=document.createElement('article');div.className='cast-card';div.innerHTML=`<img src="${art(c.art)}" alt="${esc(c.name)}"><h3>${esc(c.name)}</h3><p>${esc(c.bio)}</p>`;grid.append(div)}body.append(grid);return}if(tab==='ends'){const note=document.createElement('p');note.className='panel-note';note.textContent=`到達した結末：${profile.endings.length} / ${Object.keys(D.endings).length}。選択で変わるのは、事実を受け取ったあとの行動です。`;body.append(note);for(const id of profile.endings){const e=D.endings[id];const div=document.createElement('article');div.className='entry';div.innerHTML=`<h3>${esc(e.name)}</h3><p>${esc(e.text)}</p>`;if(profile.checkpoints[e.rewind])div.append(button('分かれ道から読み直す',()=>restore(e.rewind)));body.append(div)}return}const note=document.createElement('p');note.className='panel-note';note.textContent='到達した場面から再開できます。その時点の証拠と選択に戻ります。結末の閲覧記録は残ります。未到達の場面名や真相は表示しません。';body.append(note);for(let ch=0;ch<D.chapters.length;ch++){const ids=Object.keys(D.nodes).filter(id=>D.nodes[id].chapter===ch&&profile.checkpoints[id]);if(!ids.length)continue;const h=document.createElement('h3');h.className='flow-group';h.textContent=D.chapters[ch];body.append(h);const grid=document.createElement('div');grid.className='flow-grid';for(const id of ids){const n=D.nodes[id];const b=button('',()=>restore(id),'flow-card');b.innerHTML=`<small>${esc(D.characters[n.pov]?.name||'情景')} · ${esc(n.location)}</small><b>${esc(n.title)}</b><small>${s?.node===id?'現在の場面':'この場面から再開　→'}</small>`;grid.append(b)}body.append(grid)}}
function history(){openPanel('BACKLOG','会話履歴');for(const h of s?.history||[]){const div=document.createElement('div');div.className='log-line';div.innerHTML=`<b>${esc(h.who)} <span style="color:#82938e"> / ${esc(h.scene)}</span></b><p>${esc(h.text)}</p>`;$('panelBody').append(div)}$('panelBody').scrollTop=$('panelBody').scrollHeight}
function itemPanel(id){const item=D.items[id];openPanel('ITEM',item.name);$('panelBody').innerHTML=`<div style="font:100px serif;text-align:center;color:#c4ac78">${item.icon}</div><p class="panel-note">${esc(item.detail)}</p>`;if(id==='key'&&s.node==='final-study')$('panelBody').append(button('この部屋の宝箱に使用',()=>{closePanel();enter('revelation')}));if(id==='net'&&s.node==='lake')$('panelBody').append(button('湖で虫取り勝負をする',()=>{closePanel();openCatch()}));if(id==='stickers'&&s.node==='lake'&&has('caught')&&!has('oneSticker'))$('panelBody').append(button('森の虫かごに一枚貼る',()=>{closePanel();act(1)}))}
function settingsPanel(){openPanel('OPTIONS','設定・保存');$('panelBody').innerHTML=`<label class="settings-row">BGM・効果音の音量<input id="volumeSetting" type="range" min="0" max="100" value="${settings.volume*100}" aria-label="音量"></label><label class="settings-row">文字の速さ（0で一括表示）<input id="speedSetting" type="range" min="0" max="60" step="5" value="${settings.speed}" aria-label="文字の速さ"></label><p class="panel-note">会話・調査・選択ごとに、このブラウザーへ自動保存します。下の「保存データを書き出す」で、別のブラウザーにも移せます。</p><div id="saveActions" class="panel-tabs"></div><label class="file-button">保存データを読み込む<input id="importSave" type="file" accept="application/json,.json"></label><p class="panel-note">画像・音楽はゲームに同梱。音は最初のクリック後に再生されます。設定を閉じるには右上の ×、または Esc。</p>`;if(window.ADV_DOWNLOAD){const row=document.createElement('p');row.className='panel-note';const link=document.createElement('a');link.id='downloadArchive';link.href=window.ADV_DOWNLOAD;link.download='konchu-adv.zip';link.textContent='ZIPファイルをダウンロード（約22MB）';link.style.color='#e2c18f';row.append(link);$('panelBody').append(row)};$('volumeSetting').oninput=e=>{settings.volume=Number(e.target.value)/100;settingsSave()};$('speedSetting').oninput=e=>{settings.speed=Number(e.target.value);settingsSave()};$('saveActions').append(button('保存データを書き出す',exportSave),button('タイトルへ',()=>{save();closePanel();showTitle()}));$('importSave').onchange=async e=>{try{const data=JSON.parse(await e.target.files[0].text());validateSave(data.state);if(!data.profile||!data.profile.checkpoints||!Array.isArray(data.profile.endings))throw Error('形式が違います');for(const [id,cp]of Object.entries(data.profile.checkpoints)){if(!D.nodes[id])throw Error('場面が存在しません');validateSave({...cp,history:[]})}s=data.state;profile=data.profile;closePanel();save();resume()}catch(err){toast('読み込めませんでした：'+err.message)}}}
function validateSave(v){if(!v||v.version!==1||!D.nodes[v.node]||!['flags','evidence','items','visited','cast','history'].every(k=>Array.isArray(v[k]))||!v.known||!v.inspected)throw Error('このADV版の保存データではありません');if(v.evidence.some(id=>!D.evidence[id])||v.cast.some(id=>!D.characters[id]))throw Error('未対応のデータです');if(!['intro','idle','hotspot','action','choice','ending'].includes(v.mode))throw Error('進行データが不正です');return true}
function exportSave(){const blob=new Blob([JSON.stringify({format:'konchu-adv-1',state:s,profile})],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='昆虫とおしりの部屋-ADV-セーブ.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function newGame(){stopText();profile.checkpoints={};s=fresh();$('titleScreen').hidden=true;$('game').hidden=false;ensureAudio();enter(D.start,{revisit:true})}
function showTitle(){stopText();auto=false;$('autoButton').textContent='自動 OFF';$('game').hidden=true;$('titleScreen').hidden=false;const saved=read(SAVE,null);$('continueGame').hidden=!saved;$('titleFlow').hidden=!Object.keys(profile.checkpoints).length;if(saved&&D.nodes[saved.node])$('saveLabel').textContent=D.nodes[saved.node].title;audio?.theme('title')}
function resume(){if(!s){const data=read(SAVE,null);try{validateSave(data);s=data}catch{toast('保存データを読み込めませんでした');return}}$('titleScreen').hidden=true;$('game').hidden=false;ensureAudio();drawScene();if(s.mode==='ending')finishEnding(s.ending);else if(s.mode==='choice')renderChoices();else if(['intro','hotspot','action'].includes(s.mode))showLine({resume:true});else renderIdle()}

/* Original small WebAudio score: equal temperament, no remote music files. */
class Score{constructor(){const C=window.AudioContext||window.webkitAudioContext;this.ctx=new C();this.master=this.ctx.createGain();this.master.connect(this.ctx.destination);this.current='';this.step=0;this.timer=null;this.volume();this.ctx.resume()}
volume(){this.master.gain.setTargetAtTime(settings.muted?0:settings.volume*.29,this.ctx.currentTime,.12)}
theme(name){if(this.current===name)return;this.current=name;this.step=0;clearInterval(this.timer);if(name==='silence')return;this.tick();this.timer=setInterval(()=>this.tick(),600)}
note(midi,delay,duration,volume,type='triangle'){const t=this.ctx.currentTime+delay;const osc=this.ctx.createOscillator(),g=this.ctx.createGain();osc.type=type;osc.frequency.value=440*Math.pow(2,(midi-69)/12);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(volume,t+.06);g.gain.exponentialRampToValueAtTime(.0001,t+duration);osc.connect(g);g.connect(this.master);osc.start(t);osc.stop(t+duration+.05)}
tick(){if(this.ctx.state!=='running'||document.hidden)return;const n=this.step++;const patterns={day:[60,64,67,69,67,64,62,67,60,64,72,71,69,67,64,62],forest:[50,57,60,62,57,60,53,57,50,57,62,60,57,53,55,57],investigation:[57,64,60,67,64,60,59,64,53,60,57,64,60,57,55,59],sad:[57,60,64,67,64,60,59,55,53,57,60,64,62,60,59,57],title:[50,57,60,62,65,62,60,57],dread:[38,45,46,45,38,45,41,46]};const p=patterns[this.current]||patterns.title;const isDark=this.current==='dread';this.note(p[n%p.length],0,isDark?2.1:1.4,isDark?.07:.12,isDark?'sine':'triangle');if(n%4===0)this.note(p[Math.floor(n/8)*8%p.length]-12,0,2.6,.085,'sine');if(this.current==='day'&&n%2===0)this.note(p[n%p.length]+12,.25,.8,.035,'sine')}
ring(){const t=this.ctx.currentTime;for(const hz of [1130,1133.5,1697]){const o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type='sine';o.frequency.setValueAtTime(hz,t);o.frequency.linearRampToValueAtTime(hz-35,t+6.5);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.035,t+.7);g.gain.setTargetAtTime(.0001,t+2.5,1.2);o.connect(g);g.connect(this.master);o.start();o.stop(t+7)}}}
function ensureAudio(){try{audio??=new Score();audio.ctx.resume();audio.theme(s?node().music:'title')}catch{/* Audio is optional; story remains playable. */}}
function ring(){audio?.ring();const el=$('soundVeil');el.classList.remove('ringing');void el.offsetWidth;el.classList.add('ringing')}

/* Catch competition: a moving beetle is hit only by the actual net hoop at impact. */
let catchState=null,catchFrame=null;
function openCatch(){stopText();$('beetleGame').showModal();$('catchBug').src=art('charlotte');$('catchResult').textContent=has('caught')?'何度でも勝負できます。物語は勝敗のどちらでも進みます。':'';$('startCatch').hidden=false;$('startCatch').textContent='勝負する';$('endCatch').hidden=!has('caught');$('catchTime').textContent='20';$('yourScore').textContent='0';$('rivalScore').textContent='0';$('catchBug').style.left='50%';$('catchBug').style.top='50%';$('catchSplash').textContent='';catchState=null}
function beginCatch(){if(catchState?.running)return;ensureAudio();const field=$('catchField');catchState={running:true,start:performance.now(),player:0,rival:0,x:field.clientWidth*.5,y:field.clientHeight*.5,nx:field.clientWidth*.5,ny:field.clientHeight*.5,cooldown:0,hitUntil:0,nextRival:3.2,seed:Math.random()*6.28};$('startCatch').hidden=true;$('endCatch').hidden=true;$('catchResult').textContent='網を振り下ろすまでに、虫は少し動きます。少し先をねらって。';catchTick()}
function catchTick(){const c=catchState;if(!c?.running)return;const elapsed=(performance.now()-c.start)/1000,w=$('catchField').clientWidth,h=$('catchField').clientHeight;c.x=w*(.5+.34*Math.sin(elapsed*1.55+c.seed));c.y=h*(.5+.32*Math.sin(elapsed*1.1+c.seed*2));$('catchBug').style.left=c.x+'px';$('catchBug').style.top=c.y+'px';$('catchBug').style.opacity=performance.now()<c.hitUntil?'.15':'1';$('catchTime').textContent=Math.max(0,Math.ceil(20-elapsed));if(elapsed>=c.nextRival){c.rival++;c.nextRival+=3.1+(c.rival%3)*.24;$('rivalScore').textContent=c.rival}if(elapsed>=20){finishCatch();return}catchFrame=requestAnimationFrame(catchTick)}
function aim(e){if(catchState&&performance.now()<(catchState.aimLockedUntil||0))return;const r=$('catchField').getBoundingClientRect(),x=Math.max(0,Math.min(r.width,e.clientX-r.left)),y=Math.max(0,Math.min(r.height,e.clientY-r.top));$('netRing').style.left=x+'px';$('netRing').style.top=y+'px';if(catchState){catchState.nx=x;catchState.ny=y}}
function swing(e){const c=catchState;if(!c?.running||performance.now()<c.cooldown)return;aim(e);const impact={x:c.nx,y:c.ny};c.cooldown=performance.now()+450;c.aimLockedUntil=performance.now()+300;const ring=$('netRing');ring.classList.remove('swing');void ring.offsetWidth;ring.classList.add('swing');setTimeout(()=>{if(!c.running||performance.now()<c.hitUntil)return;const caught=Math.hypot(c.x-impact.x,c.y-impact.y)<=39;if(caught){c.player++;c.hitUntil=performance.now()+650;$('yourScore').textContent=c.player;$('catchSplash').textContent='捕まえた！'}else $('catchSplash').textContent='空振り';setTimeout(()=>{$('catchSplash').textContent=''},450)},180)}
function finishCatch(){const c=catchState;if(!c)return;c.running=false;cancelAnimationFrame(catchFrame);uniq(s.flags,'caught');$('endCatch').hidden=false;$('startCatch').hidden=false;$('startCatch').textContent='もう一度勝負';$('catchBug').style.opacity='1';$('catchResult').textContent=(c.player>c.rival?'ちゃんこの勝ち！':c.player===c.rival?'引き分け！':'くりたけの勝ち！')+(c.player===0?' 勝負のあと、くりたけと一緒に一匹を捕まえた。':' 捕まえた一匹を、虫かごに入れた。');save()}
$('catchField').addEventListener('pointermove',aim);$('catchField').addEventListener('pointerdown',e=>{e.preventDefault();swing(e)});$('startCatch').onclick=beginCatch;$('endCatch').onclick=()=>{$('beetleGame').close();renderIdle()};$('beetleGame').addEventListener('cancel',e=>{if(catchState?.running){e.preventDefault();$('catchResult').textContent='勝負は20秒で終わります。マップの移動は勝負のあとにできます。'}});

$('newGame').onclick=()=>{const saved=read(SAVE,null);if(!saved){newGame();return}openPanel('NEW GAME','はじめから');$('panelBody').innerHTML='<p class="panel-note">現在の進行を最初からに戻します。到達済みの結末の記録は残ります。</p>';$('panelBody').append(button('最初の朝から始める',()=>{closePanel();newGame()}),button('戻る',closePanel))};$('continueGame').onclick=()=>{s=null;resume()};$('titleFlow').onclick=()=>{s=read(SAVE,null);flow()};$('dialogueAdvance').onclick=advance;$('autoButton').onclick=()=>{auto=!auto;$('autoButton').textContent='自動 '+(auto?'ON':'OFF');if(auto&&rendered)reveal();else clearTimeout(autoTimer)};$('journalButton').onclick=journal;$('flowButton').onclick=()=>flow();$('povButton').onclick=()=>flow();$('historyButton').onclick=history;$('logInline').onclick=history;$('settingsButton').onclick=settingsPanel;$('closePanel').onclick=closePanel;$('panel').addEventListener('close',()=>{if(auto&&rendered)autoTimer=setTimeout(advance,1500)});$('muteButton').onclick=()=>{settings.muted=!settings.muted;settingsSave()};$('endingFlow').onclick=()=>flow('ends');$('endingTitle').onclick=showTitle;$('retryImage').onclick=()=>{$('imageError').hidden=true;$('background').src=art('bg-'+node().bg)};$('background').onerror=()=>{$('imageError').hidden=false};$('character').onerror=()=>{$('character').hidden=true;toast('人物画像を読み込めませんでした。会話は進められます。')};
document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)||$('titleScreen').hidden===false)return;if($('panel').open||$('beetleGame').open)return;if(e.key==='Enter'||e.key===' '){if(document.activeElement.tagName==='BUTTON'&&document.activeElement.id!=='dialogueAdvance')return;e.preventDefault();advance()}else if(e.key==='Escape'){e.preventDefault();settingsPanel()}});
document.addEventListener('visibilitychange',()=>{if(document.hidden){stopText();audio?.ctx.suspend();save()}else{audio?.ctx.resume();if(s&&['intro','hotspot','action'].includes(s.mode)&&!$('game').hidden)reveal()}});
