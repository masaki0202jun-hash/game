function refreshInventory(){const bar=document.querySelector('#inventoryBar');bar.style.display=started?'flex':'none';bar.replaceChildren();const label=document.createElement('span');label.textContent='アイテム';bar.append(label);if(!inventory.size){const empty=document.createElement('span');empty.textContent='なし';bar.append(empty)}for(const id of inventory){const button=document.createElement('button');button.type='button';button.dataset.item=id;button.disabled=storyEvent.active;button.title=itemData[id].name+'：選択・拡大';button.setAttribute('aria-label',itemData[id].name);button.className=selectedItem===id?'selected':'';button.innerHTML=itemIcon(id)+(id==='stickers'?'<span class="count">'+stickerCount+'</span>':'');button.onclick=()=>openItem(id);bar.append(button)}const hint=document.querySelector('#usageHint');hint.replaceChildren();hint.style.display=selectedItem?'block':'none';if(selectedItem){hint.append(itemData[selectedItem].name+'：使う対象をクリック／近くでEnter');const cancel=document.createElement('button');cancel.textContent='解除';cancel.onclick=()=>{selectedItem=null;refreshInventory()};hint.append(cancel)}}
function openItem(id){if(storyEvent.active)return;if(dialogue||mamaEntering||mamaLeaving||fadeTo||codePanel.open||!inventory.has(id))return;clearMovement();previewItem=id;document.querySelector('#itemName').textContent=itemData[id].name;document.querySelector('#itemArt').innerHTML=itemIcon(id);document.querySelector('#itemDescription').textContent=id==='stickers'?'だいじなものに貼るシール。残り'+stickerCount+'枚。':itemData[id].description;if(!itemPanel.open)itemPanel.showModal()}
document.querySelector('#useItem').onclick=()=>{selectedItem=previewItem;itemPanel.close();clearMovement();refreshInventory()};
document.querySelector('#closeItem').onclick=()=>{itemPanel.close();clearMovement()};
document.querySelector('#closeCode').onclick=()=>{codePanel.close();clearMovement()};
for(const panel of [codePanel,itemPanel]){panel.addEventListener('cancel',e=>{e.preventDefault();panel.close();clearMovement()});panel.addEventListener('close',clearMovement);panel.addEventListener('click',e=>{if(e.target!==panel)return;const r=panel.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom){panel.close();clearMovement()}})}
function openKeypad(){clearMovement();document.querySelector('#code').value='';document.querySelector('#codeMessage').textContent='番号を入力する装置が付いている。';codePanel.showModal();document.querySelector('#code').focus()}
function useOnTarget(target){if(adultState.active){adultUseOnTarget(target);return}if(!selectedItem)return;const id=selectedItem;let text;if(target.id==='chest')text='宝箱を開けるには鍵が必要だ。';else if(target.id==='cabinet')text='棚を開けるにはパスコードが必要だ。';else if(id==='stickers')text='だいじなものにだけ貼ろう。ここには使わないでおこう。';else if(target.id==='charlotte')text=id==='net'?'シャルロットはお留守番。今は網で捕まえなくていいや。':'シャルロットは部屋を歩いてていいよ。';else text='ここでは'+itemData[id].name+'は使えない。';talk([['ちゃんこ',text]])}


function hasBugKit(){return prologueDone&&['stickers','net','cage'].every(id=>inventory.has(id))}
const roomExit=document.querySelector('#roomExit');


const extraExitButtons=[0,1].map(()=>{const b=document.createElement('button');b.type='button';b.hidden=true;document.querySelector('#wrap').append(b);return b});
function navigateHome(to){if(storyEvent.active)return;if(dialogue||fadeTo||codePanel.open||itemPanel.open)return;const e=scene.ex.find(e=>e.to===to);if(e){selectedItem=null;refreshInventory();clearMovement();transition(e.to,e.at)}}
function updateRoomExit(){if(storyEvent.active){[roomExit,...extraExitButtons].forEach(b=>b.hidden=true);return}const buttons=[roomExit,...extraExitButtons];buttons.forEach(b=>b.hidden=true);if(!started||dialogue||fadeTo||codePanel.open||itemPanel.open)return;const configs={room:[['living','▼','リビングへ']],living:[['room','▲','ちゃんこの部屋へ'],['outside','◀','外へ'],['bedroom','▶','寝室へ']],bedroom:[['living','◀','リビングへ']],outside:[['living','▲','家に入る'],['village','▼','村へ']],village:[['outside','▲','家の前へ'],['artDistrict','▼','絵画教室のある通りへ']],artDistrict:[['village','▲','村へ'],['classroom','▲','絵画教室へ'],['entrance','▶','森へ']],classroom:[['artDistrict','▼','外へ']]};(configs[sceneId]||[]).forEach(([to,glyph,label],i)=>{const e=scene.ex.find(e=>e.to===to);if(!e||(e.requiresKit&&!hasBugKit())||(e.requiresMeeting&&!outsideIntroDone)||(e.requiresForest&&!forestUnlocked)||(e.requiresInvite&&!pepeInvited))return;const b=buttons[i],[x,y,w,h]=e.r;b.hidden=false;b.textContent=glyph;b.setAttribute('aria-label',label);b.onclick=()=>navigateHome(to);Object.assign(b.style,{position:'absolute',left:x/W*100+'%',top:y/H*100+'%',bottom:'auto',right:'auto',width:w/W*100+'%',height:h/H*100+'%',transform:'none',background:'transparent',border:'none',padding:'0',fontSize:'30px',color:'#fff0bd',textShadow:'0 2px 4px #000',zIndex:2});if(sceneId==='living'&&to==='room')b.style.top='27%'})}
const mamaPainting={rect:[785,65,78,94],at:[700,310]};
function nearMamaPainting(){return Math.hypot(player.x-mamaPainting.at[0],player.y-mamaPainting.at[1])<105}
function inspectMamaPainting(){if(storyEvent.active)return;if(dialogue||fadeTo||codePanel.open||itemPanel.open)return;clearMovement();talk([['ちゃんこ','この絵、ほかのとちょっと違うね。'],['ペペ先生','ああ。それは、お母さんが君くらいの頃に描いた絵だよ。'],['ちゃんこ','ちゃんママが？　ここで絵を習ってたの？'],['ペペ先生','教えていたのは、前の教室でね。この絵は、こちらへ持ってきたんだ。'],['ちゃんこ','へぇ……ちゃんママも、子供のときはこんな絵を描いてたんだ。']])}
canvas.addEventListener('click',e=>{if(!started||sceneId!=='classroom'||dialogue)return;const r=canvas.getBoundingClientRect(),p={x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};if(nearRect(p,mamaPainting.rect))inspectMamaPainting()});
function drawMamaPainting(){
 ctx.save();const [x,y,w,h]=mamaPainting.rect;ctx.drawImage(img.mamaPainting,x,y,w,h);
 if(nearMamaPainting()&&!dialogue){ctx.fillStyle='#13251ee0';ctx.fillRect(12,492,420,31);ctx.fillStyle='#f4dfbb';ctx.font='14px sans-serif';ctx.fillText('Enter：壁に飾られた小さな絵を調べる',24,513)}ctx.restore();
}
function talkToPolice(intro=false){if(storyEvent.active)return;
 if(dialogue||(!intro&&fadeTo)||codePanel.open||itemPanel.open)return;
 clearMovement();police.dir='right';player.dir='left';kuri.dir='left';
 const lines=intro&&!policeIntroDone?[['警官','おう、ちゃんこ。今日は虫取りか'],['ちゃんこ','うん！　……おまわりさん、昨日もここにいたよね'],['警官','……この辺も、ちゃんと見ておかないとな']]:[['警官','二人とも、気をつけて行っておいで。']];
 talk(lines,()=>{if(intro){policeIntroDone=true;outsideIntroDone=true;player.dir='down';kuri.dir='down'}clearMovement()});
}
canvas.addEventListener('click',e=>{if(!started||sceneId!=='outside'||dialogue||!outsideIntroDone)return;const r=canvas.getBoundingClientRect(),p={x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};if(nearRect(p,[police.x-65,police.y-175,130,190]))talkToPolice()});
function invitePepe(){if(storyEvent.active)return;if(pepeInvited||dialogue||fadeTo)return;clearMovement();pepe.dir='right';player.dir='left';talk([['ペペ先生','おや、ちゃんこにくりたけ。二人で虫取りかい？'],['くりたけ','うん！　今日はいっぱい捕まえるんだ！'],['ペペ先生','そうかい。出かける前に、ちょっと教室へおいで。二人に話しておきたいことがあるんだ。']],()=>{pepeInvited=true;transition('classroom',scenes.artDistrict.ex[1].at)})}
canvas.addEventListener('click',e=>{if(sceneId!=='artDistrict'||pepeInvited||dialogue)return;const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;if(Math.abs(x-pepe.x)<50&&y>pepe.y-100&&y<pepe.y+25)invitePepe()});
function followOutsideFriend(dt){if(player.moving){trail.unshift({x:player.x,y:player.y});if(trail.length>80)trail.pop()}const p=trail[Math.min(32,trail.length-1)];if(p&&Math.hypot(p.x-kuri.x,p.y-kuri.y)>8)moveActor(kuri,p.x-kuri.x,p.y-kuri.y,100,dt);else kuri.moving=false}
const villagePlaces=[
 {name:'交番',at:[190,420],rect:[35,270,215,140],lines:[['ちゃんこ','交番だ。何かあったら、ここに来ればいいんだよね。'],['くりたけ','迷子になるなよ、ちゃんこ！']]},
 {name:'銭湯',at:[775,360],rect:[620,140,340,205],lines:[['ちゃんこ','銭湯だ。大きなお風呂、気持ちいいんだよなぁ。'],['くりたけ','虫取りで泥だらけになったら、ここで流せばいいな！']]},
 {name:'民家',at:[240,265],rect:[65,140,210,110],lines:[['ちゃんこ','村の人の家だ。勝手に入っちゃだめだよ。']]},
 {name:'民家',at:[300,140],rect:[120,0,200,125],lines:[['ちゃんこ','窓が開いてる。風が涼しそうだ。']]},
 {name:'民家',at:[700,120],rect:[665,0,185,110],lines:[['くりたけ','ちゃんこ、よその家の庭で虫を探すなよー。']]}
];
function nearbyVillagePlace(){return villagePlaces.map(p=>({p,d:Math.hypot(player.x-p.at[0],player.y-p.at[1])})).filter(v=>v.d<65).sort((a,b)=>a.d-b.d)[0]?.p}
function inspectVillage(p){if(storyEvent.active)return;if(dialogue||fadeTo||codePanel.open||itemPanel.open)return;talk(p.lines)}
canvas.addEventListener('click',e=>{if(sceneId!=='village')return;const r=canvas.getBoundingClientRect(),p={x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height},place=villagePlaces.find(v=>nearRect(p,v.rect));if(place)inspectVillage(place)});
function talkToLivingMama(auto=false){if(storyEvent.active)return;if(storyPhase==='treated'){if(!dialogue)talk([['ちゃんママ','……ちゃんこ。そばにいてくれて、ありがとう。']]);return}if(dialogue||(!auto&&fadeTo)||codePanel.open||itemPanel.open)return;if(selectedItem&&!auto){useOnTarget({id:'mama'});return}livingMama.dir='left';talk([['ちゃんママ','網と虫かご、ちゃんと持った？　くりたけくんを待たせないのよ。'],['ちゃんこ','持った持った！　今日はいっぱい捕まえてくる！'],['ちゃんママ','森は危ないから、絶対に行っちゃだめよ。'],['ちゃんママ','夢中になって、帰る時間を忘れないでね。暗くなる前に帰ってくるのよ。'],['ちゃんこ','はーい、わかってるって！']])}
canvas.addEventListener('click',e=>{if(sceneId!=='living'||dialogue)return;const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;if(x>livingMama.x-45&&x<livingMama.x+45&&y>livingMama.y-180&&y<livingMama.y+15)talkToLivingMama()});

function loop(t){const dt=Math.min((t-last)/1000,.04)||0;last=t;if(ready)update(dt);if(ready)render();requestAnimationFrame(loop)}
addEventListener('keydown',e=>{if(codePanel.open)return;keys[e.code]=true;if(e.code==='KeyR'&&!adultState.active&&storyPhase==='none'&&started&&sceneId==='room'&&prologueDone)startPrologue();if(!pressed[e.code]&&['Enter','Space'].includes(e.code)){e.preventDefault();interact()}pressed[e.code]=true});addEventListener('keyup',e=>{keys[e.code]=false;pressed[e.code]=false});document.querySelector('#begin').onclick=startNewGame;requestAnimationFrame(loop);
</script></body></html>
